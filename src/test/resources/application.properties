spring.application.name=audition-api
spring.mvc.problemdetails.enabled=true

management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,prometheus

api.base-url=https://jsonplaceholder.typicode.com
api.connect-timeout=5s
api.read-timeout=5s
api.title-filter-max-length=200
api.query-param.post-id=postId
api.query-param.title=title
api.endpoints.posts=/posts
api.endpoints.post-by-id=/posts/{id}
api.endpoints.comments=/comments
api.endpoints.post-with-comments=/posts/{id}/with-comments
api.endpoints.post-comments=/posts/{id}/comments

app.headers.trace-id=X-Trace-Id
app.headers.span-id=X-Span-Id
app.jackson.date-format=yyyy-MM-dd

messages.default-title=API Error Occurred
messages.default-detail=API Error occurred. Please contact support or administrator.
messages.invalid-request-title=Invalid Request
messages.resource-not-found-title=Resource Not Found
messages.upstream-service-title=Upstream Service Error
messages.post-id-positive=Post ID must be a positive integer
messages.post-not-found=Cannot find a Post with id {0}
messages.retrieve-posts-failed=Unable to retrieve posts from upstream service
messages.retrieve-post-failed=Unable to retrieve post {0}
messages.retrieve-comments-failed=Unable to retrieve comments for post {0}
messages.upstream-retrieve-post-failed=Upstream service failed to retrieve post {0}
messages.invalid-status-code=Invalid status code on SystemException; returning 500
messages.title-filter-too-long=Title filter must not exceed {0} characters
messages.problem-detail=HTTP error: status=%s, title=%s, detail=%s
